name: Deploy ASP.NET Core Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Restore Dependencies
      run: dotnet restore exam/Exam/Exam/Exam.csproj

    - name: Publish Application
      run: dotnet publish exam/Exam/Exam/Exam.csproj -c Release -o ./publish

    - name: Stop App and Show Maintenance Page
      shell: powershell
      run: |
        # Stop any running instances of the application
        Stop-Process -Name "Exam" -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
        
        # Start maintenance page on the SAME port as the app (9099)
        $scriptPath = Resolve-Path "ServeOfflinePage.ps1"
        $htmlPath = Resolve-Path "exam/Exam/Exam/app_offline.htm"
        Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$scriptPath`" -Port 9099 -FilePath `"$htmlPath`"" -WindowStyle Hidden
        Start-Sleep -Seconds 2

    - name: Copy Files to Deploy Directory
      shell: powershell
      run: |
        $deployDir = "C:\exam-prod"
        if (!(Test-Path -Path $deployDir)) {
            New-Item -ItemType Directory -Path $deployDir -Force
        }
        Copy-Item -Path "./publish/*" -Destination $deployDir -Recurse -Force

    - name: Start Application in Background
      shell: powershell
      env:
        RUNNER_TRACKING_ID: ""
      run: |
        # Stop the maintenance page listener
        $stopFile = Join-Path $env:TEMP "stop_listener_9099.txt"
        New-Item -Path $stopFile -ItemType File -Force | Out-Null
        Start-Sleep -Seconds 2
        
        # Start the new application
        $deployDir = "C:\exam-prod"
        Start-Process -FilePath "$deployDir\Exam.exe" -WorkingDirectory $deployDir -WindowStyle Hidden

