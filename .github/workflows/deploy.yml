name: Deploy ASP.NET Core Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Restore Dependencies
      run: dotnet restore exam/Exam/Exam/Exam.csproj

    - name: Publish Application
      run: dotnet publish exam/Exam/Exam/Exam.csproj -c Release -o ./publish

    - name: Stop App and Show Maintenance Page
      shell: powershell
      run: |
        # Stop the Windows Service if it exists and is running
        $serviceName = "ExamAppService"
        $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($null -ne $service -and $service.Status -eq 'Running') {
            Write-Host "Stopping Windows Service '$serviceName'..."
            Stop-Service -Name $serviceName -Force
        }
        
        # Stop any other running instances of the application
        Stop-Process -Name "Exam" -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 5
        
        # Start maintenance page on the SAME port as the app (9099)
        $scriptPath = Resolve-Path "ServeOfflinePage.ps1"
        $htmlPath = Resolve-Path "exam/Exam/Exam/app_offline.htm"
        Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$scriptPath`" -Port 9099 -FilePath `"$htmlPath`"" -WindowStyle Hidden
        Start-Sleep -Seconds 2

    - name: Copy Files to Deploy Directory
      shell: powershell
      run: |
        $deployDir = "C:\exam-prod"
        if (!(Test-Path -Path $deployDir)) {
            New-Item -ItemType Directory -Path $deployDir -Force
        }
        Copy-Item -Path "./publish/*" -Destination $deployDir -Recurse -Force

    - name: Start Application as Windows Service
      shell: powershell
      run: |
        # Stop the maintenance page listener
        $stopFile = Join-Path $env:TEMP "stop_listener_9099.txt"
        New-Item -Path $stopFile -ItemType File -Force | Out-Null
        Start-Sleep -Seconds 2
        
        # Ensure the Windows Service is registered and started
        $serviceName = "ExamAppService"
        $deployDir = "C:\exam-prod"
        $exePath = Join-Path $deployDir "Exam.exe"
        
        $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($null -eq $service) {
            Write-Host "Registering Windows Service '$serviceName'..."
            New-Service -Name $serviceName -BinaryPathName $exePath -DisplayName "Exam Application Service" -StartupType Automatic
        }
        
        Write-Host "Starting Windows Service '$serviceName'..."
        Start-Service -Name $serviceName

